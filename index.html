<style>
:root{--bg:#15110E;--pan:#241B15;--pan2:#33261C;--fg:#EFE3CC;--mut:#A89677;--gold:#C9A24B;--red:#A31F1F;--bt:#9E1B1B;--onbt:#FFF3D6;--line:#4A3A2A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 'EB Garamond',Georgia,serif}
h1,h2,h3,.logo,.lk,.b,.o,.tabs button{font-family:Cinzel,Georgia,serif}h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.05;margin:0}h2{margin:.5rem 0 1rem}h3{margin:0}

.logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.4rem;color:var(--gold)}
.nav nav{display:flex;flex-wrap:wrap}.lk{position:relative;background:none;border:0;color:inherit;font-size:1rem;padding:.3rem .8rem}.lk::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s}.lk:hover::after,.lk[aria-current]::after{transform:scaleX(1)}

.ct{max-width:1180px;margin:0 auto;padding:1.5rem}.rt{display:flex;justify-content:flex-end;gap:.6rem;margin:.5rem 0;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.4rem}.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}

.tabs{display:flex;gap:1.2rem;border-bottom:1px solid var(--line);margin:1rem 0;flex-wrap:wrap}.tabs button{background:none;border:0;padding:.4rem .1rem;color:var(--mut);text-transform:uppercase;font-size:.85rem;border-bottom:2px solid transparent}.tabs button[aria-current]{color:var(--fg);border-color:var(--gold)}

.lb{font:700 .7rem Cinzel;text-align:center;margin-top:.5rem;color:var(--mut)}

.hx{position:relative;width:320px;height:320px;margin:0 auto}.nd{position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:2px solid var(--gold);background:var(--pan);display:grid;justify-items:center;align-content:center;text-align:center;line-height:1.05}
.nd .mdv{background:none;border:0;font:700 1.6rem Cinzel}.nd small{font-size:.65rem;color:var(--mut)}.nd input{width:44px;padding:0;text-align:center;font-size:.8rem}.nd b{display:none}
.ctr{position:absolute;inset:0;display:grid;place-items:center;font:700 1.1rem Cinzel;color:var(--gold);z-index:-1}
.bx3{display:flex;gap:.5rem;margin:.8rem 0;flex-wrap:wrap}.bx3 div{border:1px solid var(--line);padding:.2rem .5rem;text-align:center;flex:1;min-width:70px}.bx3 label{font:700 .6rem Cinzel;color:var(--mut);display:block}.bx3 input{border:0;background:none;text-align:center;padding:0}.bx3 button{background:none;border:0;font-weight:700}

.dc{background:none;border:0;color:var(--gold);padding:.1rem}.tr{background:none;border:0;color:var(--gold);font-size:1.1rem}.sn.t1{color:#6FBF73}.sn.t2{color:#5AA9E6}

.ul{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:.5rem 0}.rr{display:flex;align-items:center;gap:.5rem}
.mdl{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:1rem}.mdl .bx{background:var(--pan);border:1px solid var(--gold);border-radius:6px;padding:1.2rem;width:min(460px,100%);max-height:90vh;overflow:auto}.mdl label{display:block;font-size:.85rem;margin:.6rem 0 .1rem;color:var(--mut)}.ar{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1208;padding:.6rem 1rem;border-radius:6px;display:none;z-index:10;font-weight:600;text-align:center;max-width:90vw}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center;padding:4rem 1.5rem;max-width:1100px;margin:0 auto}.hero p{font-size:1.25rem;max-width:44ch}

.lg{max-width:380px;margin:8vh auto;padding:1.5rem}

.ak{transition:border-color .2s,background .2s}.ak:hover{border-color:var(--gold)}

.nd{transition:transform .2s,box-shadow .2s}.nd:hover{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 16px #c9a24b66}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--pan)}.tabs button{transition:color .2s,border-color .3s}
.hx{isolation:isolate}.mrow .o{margin-right:.4rem}.mrow .x{margin-right:.2rem}

.lg{animation:pp .45s cubic-bezier(.2,1.2,.4,1)}.die svg{width:100%;height:auto;animation:fl 6s ease-in-out infinite}.die:hover{transform:scale(1.06)}
#toast{display:block!important;opacity:0;transform:translate(-50%,20px);pointer-events:none;transition:opacity .3s,transform .3s}#toast.show{opacity:1;transform:translate(-50%,0)}
.rf{position:fixed;left:50%;top:40%;width:160px;height:160px;display:grid;place-items:center;color:var(--gold);z-index:11;pointer-events:none;animation:rf 1.6s ease-out forwards}
.rf svg{position:absolute;inset:0;width:100%;height:100%;animation:tum .7s ease-out}.rf b{position:relative;font:700 2.8rem Cinzel;color:#fff;text-shadow:0 2px 8px #000}
.rf.c20{color:#4caf50;filter:drop-shadow(0 0 20px #4caf50)}.rf.c1{color:#d33}.rf.c1 svg{animation:tum .7s ease-out,shk .35s .7s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>

S=S&&S.hb?S:{user:null,chars:[],camps:[],hb:{},log:[]};S.hb={Ameaças:[],Habilidades:[],Magias:[],Itens:[],...S.hb};if(S.hb.Monstros){S.hb.Ameaças.push(...S.hb.Monstros.map(m=>({id:m.id,n:m.n,tx:m.d,ty:'Monstruosidade',sz:'Médio',nd:'?',ca:10,pv:'10',dl:'9 m',a:[10,10,10,10,10,10]})));delete S.hb.Monstros}

function upd(){const c=C();if(!c)return;document.querySelectorAll('[data-d]').forEach(e=>{const[t,k]=e.dataset.d.split(':');e.textContent=t=='m'?sg(md(c.a[k])):t=='s'?'('+sg(skb(c,k,SK.find(x=>x[0]==k)[1]))+')':t=='pb'?sg(pb(c.lv)):t=='pp'?10+skb(c,'Percepção','SAB'):sg(md(c.a.DES))})}
const save=()=>{try{localStorage.setItem('cw',JSON.stringify(S))}catch(e){toast('Sem espaço: use imagens menores.')}};
const shrink=(f,max)=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)});
function roll(e){let t=0,p=[],nat=null;e.replace(/\s/g,'').replace(/([+-]?)(\d*)d(\d+)|([+-]?\d+)/g,(m,s,n,f,k)=>{if(f){n=+n||1;const r=[];for(let i=0;i<n;i++)r.push(1+Math.floor(Math.random()*f));const q=r.reduce((a,b)=>a+b,0);t+=s=='-'?-q:q;p.push('['+r+']');if(f==20&&n==1&&p.length==1)nat=r[0]}else if(k){t+=+k;p.push(k)}return m});return{t,x:p.join(''),nat}}
function lg(w,l,e){const r=roll(e);S.log.unshift({w,l,e,t:r.t,x:r.x,nat:r.nat,h:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});S.log=S.log.slice(0,40);save();rf(r.t,r.nat);toast(`${w} · ${l}: ${r.t}  ${r.x}`);if(P=='camp'){POP='.res .rs';R()}}
function ask(title,fs,ok,cb,info){const m=document.createElement('div');m.className='mdl';m.innerHTML=`<div class="bx" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${info?`<p>${info}</p>`:''}<div class="fgrid">${fs.map((f,i)=>`<div style="--s:${f.s||6}"><label for="f${i}">${f.l}</label>${f.t=='area'?`<textarea rows="4" id="f${i}">${esc(f.v)}</textarea>`:f.t=='select'?`<select id="f${i}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="f${i}" type="${f.t||'text'}" ${f.t=='file'?'accept="image/*"':''} value="${esc(f.v)}">`}</div>`).join('')}</div><div class="ar"><button class="o" data-x>Cancelar</button><button class="b" data-ok>${ok}</button></div></div>`;
const cl=()=>{m.classList.add('cl');setTimeout(()=>m.remove(),200)};document.body.appendChild(m);
m.onkeydown=e=>{if(e.key=='Escape')cl();if(e.key=='Enter'&&e.target.tagName=='INPUT'&&e.target.type!='file')m.querySelector('[data-ok]').click()};
m.onclick=async e=>{if(e.target==m||e.target.hasAttribute('data-x'))cl();else if(e.target.hasAttribute('data-ok')){const v={};for(let i=0;i<fs.length;i++){const el=m.querySelector('#f'+i);v[fs[i].k]=fs[i].t=='file'?(el.files[0]?await shrink(el.files[0],fs[i].m||400):''):fs[i].t=='number'?+el.value:el.value}cl();cb(v)}};const f=m.querySelector('input,textarea,select');f&&f.focus()}

const land=()=>`<div class="nav"><span class="logo">${D20} Casaro's World</span><button class="b" data-a="login">Entrar na mesa</button></div>
<section class="hero"><div><h1>Sua campanha de D&amp;D 5e, forjada em um só lugar.</h1><p>Fichas vivas, ameaças feitas por você, combate por iniciativa e a mesa virtual do Owlbear Rodeo, para o mestre e para cada jogador.</p><p><button class="b" data-a="login">Criar meu personagem</button> <button class="o" data-a="login">Já tenho uma mesa</button></p></div>
